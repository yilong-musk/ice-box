[package]
name = "ice-tun-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TUN capture ownership, platform permission, and recovery journal (macOS / Windows)"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
ice-types = { workspace = true }
ice-tun-pin = { workspace = true }
ice-tun-helper-proto = { workspace = true }
ice-tun-journal = { workspace = true }
ice-config-guard = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
ice-helper = { path = "../ice-helper", features = ["test-hooks"] }