[package]
name = "ice-runtime"
version.workspace = true
description = "Headless shared runtime for ice-box desktop and CLI"
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
ice-core = { workspace = true }
ice-proxy-sys = { workspace = true }
ice-engine = { workspace = true }
ice-config = { workspace = true }
ice-tun-sys = { workspace = true }
ice-elevate = { workspace = true }
sha2 = "0.10"
libc = "0.2"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
time = { workspace = true }
ureq = { workspace = true }
fs2 = "0.4"
url = "2.5.8"

[dev-dependencies]
ice-config = { workspace = true, features = ["test-hooks"] }
ice-core = { workspace = true, features = ["test-hooks"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
