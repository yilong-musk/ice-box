[package]
name = "ice-tun-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Elevated scheduled-task launcher for the Windows TUN core"

[dependencies]
serde_json = { workspace = true }
ice-config-guard = { workspace = true }
ice-tun-pin = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }