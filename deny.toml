# SPDX-License-Identifier: GPL-3.0-or-later
# cargo-deny policy (CI-2). Advisories, licenses, and crate sources.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
yanked = "deny"
# Tauri 2 still pulls GTK3 (Linux webview) and urlpattern/unic-* transitives
# that RustSec marks unmaintained. Fail only if a workspace crate depends on
# those crates directly; yanked and vulnerability advisories still deny.
unmaintained = "workspace"
ignore = [
    # glib 0.18 is pinned by gtk 0.18 / webkit2gtk 2.0 (Tauri 2 Linux). gtk3-rs
    # is unmaintained; the 0.20 fix requires Tauri's GTK4 migration.
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 unsoundness is pinned by Tauri 2 GTK3; no upgrade until GTK4" },
]

[licenses]
version = 2
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
