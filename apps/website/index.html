<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ice-box — a lightweight proxy client for macOS, Windows, and Android. Easy to set up, quick to start, and light on memory and CPU once it runs." />
    <meta name="theme-color" content="#07090b" />
    <title>ice-box — the best sing-box GUI</title>
    <script>
      // Same rule as the app's theme.ts: set the theme before first paint so a
      // light-mode visitor never sees a dark flash.
      try {
        var pref = localStorage.getItem("ice-box.theme");
        var dark = pref === "dark" || (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
