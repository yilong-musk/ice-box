[package]
name = "ice-box-mobile"
version.workspace = true
description = "ice-box Android shell (Tauri)"
authors.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ice_box_mobile_lib"
# Android loads the cdylib; main.rs uses the rlib. There is no iOS target,
# so no staticlib (it would only add a second LTO pass to release builds).
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-tunnel = { path = "../plugins/tunnel" }
ice-app = { workspace = true }
ice-config = { workspace = true }
ice-core = { workspace = true }
ice-subscription = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
log = "0.4"
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", default-features = false }
rustls-platform-verifier = "=0.7.0"
