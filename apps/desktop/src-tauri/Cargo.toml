[package]
name = "ice-box"
version.workspace = true
description = "ice-box desktop shell (Tauri)"
authors.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ice_box_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
ice-core = { workspace = true }
ice-proxy-sys = { workspace = true }
ice-engine = { workspace = true }
ice-config = { workspace = true }
ice-tun-sys = { workspace = true }
ice-elevate = { workspace = true }
sha2 = "0.10"
libc = "0.2"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
chrono = { workspace = true }
fs2 = "0.4"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
url = "2.5.8"

[dev-dependencies]
ice-config = { workspace = true, features = ["test-hooks"] }
ice-core = { workspace = true, features = ["test-hooks"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# The menu-bar readout: `with_inner_tray_icon` reaches the status item's button
# so the icon and the two-line speed label can be composed into the item's image
# (see `tray_speed.rs`). Versions match what `tauri`'s own macOS stack already
# resolves to, so no extra code enters the app.
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "block2",
    "NSButton",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSFontDescriptor",
    "NSImage",
    "NSParagraphStyle",
    "NSResponder",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSText",
    "NSStringDrawing",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSAttributedString",
    "NSDictionary",
    "NSLocale",
    "NSObject",
    "NSString",
    "objc2-core-foundation",
] }
