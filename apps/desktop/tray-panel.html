<!doctype html>
<html lang="zh-CN" class="tray-panel-doc">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ice-box</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("ice-box.theme") || "system";
          var dark =
            pref === "dark" ||
            (pref !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>

  <body class="tray-panel">
    <div id="root"></div>
    <script type="module" src="/src/tray-panel/main.tsx"></script>
  </body>
</html>
