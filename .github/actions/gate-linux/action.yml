name: Linux gate
description: Install the Linux prerequisites and run the full workspace gate.

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: "1.94.1"
        components: rustfmt, clippy

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ice-box-${{ runner.os }}
        cache-on-failure: true

    - uses: actions/setup-node@v7
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: |
          apps/desktop/package-lock.json
          apps/website/package-lock.json

    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
          libayatana-appindicator3-dev librsvg2-dev libssl-dev minisign

    - name: Install frontend deps
      shell: bash
      working-directory: apps/desktop
      run: npm ci

    - name: Install website deps
      shell: bash
      working-directory: apps/website
      run: npm ci

    - name: Install Playwright Chromium
      shell: bash
      working-directory: apps/website
      run: npx playwright install --with-deps chromium

    - name: Workspace gate (G9.10)
      shell: bash
      run: bash scripts/gate.sh
