name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ice-box-${{ runner.os }}
          cache-on-failure: true

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop

      - name: Fetch sing-box binary
        run: ./scripts/fetch-singbox.sh mac-arm64

      - name: Workspace gate (G9.10)
        run: bash scripts/gate.sh

      - name: Headless macOS acceptance (G9.1 / G9.6 / G9.7)
        run: cargo test -p ice-box --lib 'g9_' -- --nocapture

      - name: macOS proxy-sys unit tests
        run: cargo test -p ice-proxy-sys --lib

      - name: Build app bundle (tauri build)
        run: npm run tauri build
        working-directory: apps/desktop

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v6
        with:
          name: ice-box-macos
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows (NSIS)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ice-box-${{ runner.os }}
          cache-on-failure: true

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop

      - name: Fetch sing-box binary
        run: ./scripts/fetch-singbox.sh win

      - name: Workspace gate (G9.10)
        run: bash scripts/gate.sh

      - name: Headless acceptance (G9.1 / G9.6 / G9.7)
        run: cargo test -p ice-box --lib 'g9_' -- --nocapture

      - name: Build app bundle (tauri build, NSIS)
        run: npm run build:win
        working-directory: apps/desktop

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v6
        with:
          name: ice-box-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare release notes
        id: notes
        run: |
          bash scripts/release-notes.sh "${{ github.ref_name }}" > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release-assets/* \
            NOTICE \
            third_party/sing-box/LICENSE \
            --title "ice-box ${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md