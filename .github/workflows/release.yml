name: Release

on:
  push:
    tags:
      - "v*"

# Least privilege: only the publish job writes to the repository.
permissions:
  contents: read

# Serialize every release run, including different tags: a slower older build
# must not publish after a newer tag and move GitHub's "latest" backwards.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag, version sources, changelog, and secrets
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # Tags pushed from an unmerged release branch must not publish.
          git rev-parse --verify --quiet origin/main >/dev/null
          tag_commit="$(git rev-list -n 1 "$TAG")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "$TAG is not reachable from main" >&2
            exit 1
          fi

          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          missing=0
          for name in TAURI_SIGNING_PRIVATE_KEY ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "GitHub Actions secret $name is empty" >&2
              missing=1
            fi
          done
          test "$missing" -eq 0

          args=()
          # An already published release is verification-only on a rerun. A
          # draft must still be newer than the latest published release, so an
          # abandoned old draft cannot be published after a newer release.
          release_state="$(gh release view "$TAG" --json isDraft \
            --jq '.isDraft' 2>/dev/null || true)"
          if [[ "$release_state" == "false" ]]; then
            args+=(--allow-existing)
          else
            latest_tags="$(gh release list --limit 100 --exclude-drafts \
              --json tagName --jq '.[].tagName')"
            while IFS= read -r latest; do
              if [[ -n "$latest" ]]; then
                args+=(--latest-tag "$latest")
              fi
            done <<< "$latest_tags"
          fi
          bash scripts/release-preflight.sh "$TAG" "${args[@]}"

  # The full gate (including frontend and website builds) runs once on Linux.
  # The packaging jobs run only the platform half and then build.
  gate-linux:
    name: Gate (linux)
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ice-box-${{ runner.os }}
          cache-on-failure: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/website/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop

      - name: Install website deps
        run: npm ci
        working-directory: apps/website

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/website

      - name: Workspace gate (G9.10)
        run: bash scripts/gate.sh

  build-macos:
    name: Build macOS (arm64)
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ice-box-${{ runner.os }}
          cache-on-failure: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop

      - name: Fetch sing-box binary
        run: ./scripts/fetch-singbox.sh mac-arm64

      - name: Fetch GeoIP rule-sets
        run: ./scripts/fetch-geoip.sh

      - name: Workspace gate (G9.10, rust)
        env:
          GATE_SCOPE: rust
        run: bash scripts/gate.sh

      - name: Build app bundle (tauri build)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --config src-tauri/tauri.updater.conf.json
        working-directory: apps/desktop

      - name: Verify privileged helper embedded (T5)
        run: |
          APP=$(find target/release/bundle/macos -name '*.app' -maxdepth 1 | head -n 1)
          test -n "$APP"
          test -x "$APP/Contents/Resources/ice-helper"
          echo "helper embedded: $APP/Contents/Resources/ice-helper"

      - name: Verify app bundle code signature (R3)
        run: |
          APP=$(find target/release/bundle/macos -name '*.app' -maxdepth 1 | head -n 1)
          test -n "$APP"
          bash scripts/verify-macos-code-sign.sh "$APP"

      - name: Verify macOS architecture and DMG name
        run: |
          APP=$(find target/release/bundle/macos -name '*.app' -maxdepth 1 | head -n 1)
          test -n "$APP"
          BIN="$APP/Contents/MacOS/ice-box"
          test -x "$BIN"
          archs="$(lipo -archs "$BIN")"
          echo "app architectures: $archs"
          case " $archs " in
          *" arm64 "*) ;;
          *)
            echo "expected an arm64 binary, got: $archs" >&2
            exit 1
            ;;
          esac
          case " $archs " in
          *" x86_64 "*)
            echo "unexpected x86_64 slice: $archs" >&2
            exit 1
            ;;
          esac
          shopt -s nullglob
          dmg=(target/release/bundle/dmg/*.dmg)
          test "${#dmg[@]}" -eq 1
          expected="ice-box_${GITHUB_REF_NAME#v}_aarch64.dmg"
          case "$(basename "${dmg[0]}")" in
          "$expected") ;;
          *)
            echo "unexpected DMG name: ${dmg[0]} (expected $expected)" >&2
            exit 1
            ;;
          esac
          echo "release DMG: ${dmg[0]}"

      - name: Verify updater artifacts (macOS)
        run: |
          shopt -s nullglob
          tar=(target/release/bundle/macos/*.app.tar.gz)
          sig=(target/release/bundle/macos/*.app.tar.gz.sig)
          test "${#tar[@]}" -eq 1
          test "${#sig[@]}" -eq 1
          test -s "${sig[0]}"
          echo "updater archive: ${tar[0]}"
          echo "updater signature: ${sig[0]}"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ice-box-macos
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  build-windows:
    name: Build Windows (NSIS)
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ice-box-${{ runner.os }}
          cache-on-failure: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop

      - name: Fetch sing-box binary
        run: ./scripts/fetch-singbox.sh win

      - name: Fetch GeoIP rule-sets
        run: ./scripts/fetch-geoip.sh

      - name: Workspace gate (G9.10, rust)
        env:
          GATE_SCOPE: rust
        run: bash scripts/gate.sh

      - name: Build app bundle (tauri build, NSIS)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:win -- --config src-tauri/tauri.updater.conf.json
        working-directory: apps/desktop

      - name: Verify updater artifacts (Windows)
        run: |
          shopt -s nullglob
          exe=(target/release/bundle/nsis/*-setup.exe)
          if [[ "${#exe[@]}" -eq 0 ]]; then
            exe=(target/release/bundle/nsis/*.exe)
          fi
          sig=(target/release/bundle/nsis/*.exe.sig)
          test "${#exe[@]}" -ge 1
          test "${#sig[@]}" -ge 1
          test -s "${sig[0]}"
          expected="ice-box_${GITHUB_REF_NAME#v}_x64-setup.exe"
          case "$(basename "${exe[0]}")" in
          "$expected") ;;
          *)
            echo "unexpected NSIS artifact name: ${exe[0]} (expected $expected)" >&2
            exit 1
            ;;
          esac
          echo "nsis installer: ${exe[0]}"
          echo "updater signature: ${sig[0]}"

      - name: Verify Windows NSIS payload (sing-box, libcronet, launcher)
        run: |
          shopt -s nullglob
          exe=(target/release/bundle/nsis/*-setup.exe)
          if [[ "${#exe[@]}" -eq 0 ]]; then
            exe=(target/release/bundle/nsis/*.exe)
          fi
          test "${#exe[@]}" -ge 1
          listing=""
          if command -v 7z >/dev/null; then
            listing=$(7z l "${exe[0]}")
          elif [[ -x "/c/Program Files/7-Zip/7z.exe" ]]; then
            listing=$("/c/Program Files/7-Zip/7z.exe" l "${exe[0]}")
          else
            echo "7z not found; falling back to target/release resources"
            test -f target/release/sing-box.exe
            test -f target/release/libcronet.dll
            test -f target/release/ice-tun-launcher.exe
            exit 0
          fi
          echo "$listing"
          for name in sing-box.exe libcronet.dll ice-tun-launcher.exe; do
            echo "$listing" | grep -Fq "$name" || {
              echo "missing $name in NSIS payload"
              exit 1
            }
          done

      - name: Upload NSIS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ice-box-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  build-android:
    name: Build Android (arm64)
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Go builds libbox from a sing-box checkout that does not exist yet.
      # The default module cache looks for a repo go.mod and warns when it
      # is missing.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ice-box-${{ runner.os }}-android-release
          cache-on-failure: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop

      # See ci.yml: do not install the removed `tools` package.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: bash scripts/ci-install-android-sdk.sh

      - name: Materialize release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "GitHub Actions secret $name is empty" >&2
              missing=1
            fi
          done
          test "$missing" -eq 0
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ice-box-release.jks"
          test -s "$RUNNER_TEMP/ice-box-release.jks"

      - name: Build signed release APK
        env:
          ICE_BOX_ANDROID_KEYSTORE: ${{ runner.temp }}/ice-box-release.jks
          ICE_BOX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ICE_BOX_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ICE_BOX_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/build-android-apk.sh release arm64

      - name: Name and verify the release APK
        run: |
          ver="${GITHUB_REF_NAME#v}"
          src="$(find apps/mobile/src-tauri/gen/android/app/build/outputs/apk -type f -path '*/release/*.apk' | head -n 1)"
          test -n "$src"
          cp "$src" "ice-box_${ver}_android_arm64.apk"
          bash scripts/verify-android-apk.sh --release --version "$ver" \
            "ice-box_${ver}_android_arm64.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: ice-box-android
          path: ice-box_*_android_arm64.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [preflight, gate-linux, build-macos, build-windows, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Configure required reviewers on this environment to gate publication.
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      # upload-artifact keeps bundle subdirs (macos/, dmg/, nsis/). Flatten so
      # merge-updater-latest.sh and the release upload see files at one level.
      - name: Flatten downloaded artifacts
        run: |
          find release-assets -mindepth 2 -type f -exec mv -t release-assets {} +
          find release-assets -mindepth 1 -type d -empty -delete
          ls -la release-assets

      - name: Prepare release assets
        run: |
          set -euo pipefail
          version="${TAG#v}"

          cp LICENSE NOTICE release-assets/
          cp third_party/sing-box/LICENSE release-assets/sing-box-LICENSE

          bash scripts/release-notes.sh "$TAG" > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

          bash scripts/verify-updater-signatures.sh release-assets

          test -s "release-assets/ice-box_${version}_aarch64.dmg"
          test -s "release-assets/ice-box_${version}_x64-setup.exe"
          test -s "release-assets/ice-box_${version}_android_arm64.apk"

          if [[ "$PRERELEASE" == "true" ]]; then
            # A pre-release must never feed the stable in-app updater.
            rm -f release-assets/latest.json
            echo "pre-release: latest.json is intentionally not published"
          else
            bash scripts/merge-updater-latest.sh \
              release-assets "$TAG" RELEASE_NOTES.md > release-assets/latest.json
            test -s release-assets/latest.json
          fi

          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' |
              sort | xargs -d '\n' sha256sum > SHA256SUMS
            sha256sum -c --quiet SHA256SUMS
          )

          ls -la release-assets

      - name: Create or resume draft release
        id: release
        run: |
          set -euo pipefail
          if state="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$state" == "true" ]]; then
              echo "resuming draft release $TAG"
              echo "published=false" >> "$GITHUB_OUTPUT"
              gh release edit "$TAG" --notes-file RELEASE_NOTES.md
            else
              echo "release $TAG is already published; verification only"
              echo "published=true" >> "$GITHUB_OUTPUT"
            fi
          else
            gh release create "$TAG" --draft \
              --title "ice-box $TAG" --notes-file RELEASE_NOTES.md
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload draft assets
        if: steps.release.outputs.published != 'true'
        run: gh release upload "$TAG" release-assets/* --clobber

      - name: Verify draft assets
        if: steps.release.outputs.published != 'true'
        run: |
          set -euo pipefail
          expected="$(cd release-assets && find . -maxdepth 1 -type f -printf '%f\n' | sort)"
          actual="$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)"
          if [[ "$expected" != "$actual" ]]; then
            echo "draft asset list does not match the prepared assets" >&2
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi

      - name: Publish release
        if: steps.release.outputs.published != 'true'
        run: |
          set -euo pipefail
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id')"
          if [[ "$PRERELEASE" == "true" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
              -F draft=false -F prerelease=true -f make_latest=false
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
              -F draft=false -F prerelease=false -f make_latest=true
          fi

      - name: Verify published release
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            bash scripts/verify-release-assets.sh --prerelease "$TAG"
          else
            bash scripts/verify-release-assets.sh "$TAG"
          fi
