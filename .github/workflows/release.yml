name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ice-box-${{ runner.os }}
          cache-on-failure: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/website/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop

      - name: Install website deps
        run: npm ci
        working-directory: apps/website

      - name: Fetch sing-box binary
        run: ./scripts/fetch-singbox.sh mac-arm64

      - name: Fetch GeoIP rule-sets
        run: ./scripts/fetch-geoip.sh

      - name: Workspace gate (G9.10)
        run: bash scripts/gate.sh

      - name: Headless macOS acceptance (G9.1 / G9.6 / G9.7)
        run: cargo test -p ice-box --lib 'g9_' -- --nocapture

      - name: macOS proxy-sys tests
        run: cargo test -p ice-proxy-sys

      - name: Build app bundle (tauri build)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --config src-tauri/tauri.updater.conf.json
        working-directory: apps/desktop

      - name: Verify privileged helper embedded (T5)
        run: |
          APP=$(find target/release/bundle/macos -name '*.app' -maxdepth 1 | head -n 1)
          test -n "$APP"
          test -x "$APP/Contents/Resources/ice-helper"
          echo "helper embedded: $APP/Contents/Resources/ice-helper"

      - name: Verify updater artifacts (macOS)
        run: |
          shopt -s nullglob
          tar=(target/release/bundle/macos/*.app.tar.gz)
          sig=(target/release/bundle/macos/*.app.tar.gz.sig)
          test "${#tar[@]}" -eq 1
          test "${#sig[@]}" -eq 1
          test -s "${sig[0]}"
          echo "updater archive: ${tar[0]}"
          echo "updater signature: ${sig[0]}"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ice-box-macos
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  build-windows:
    name: Build Windows (NSIS)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ice-box-${{ runner.os }}
          cache-on-failure: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/website/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop

      - name: Install website deps
        run: npm ci
        working-directory: apps/website

      - name: Fetch sing-box binary
        run: ./scripts/fetch-singbox.sh win

      - name: Fetch GeoIP rule-sets
        run: ./scripts/fetch-geoip.sh

      - name: Workspace gate (G9.10)
        run: bash scripts/gate.sh

      - name: Headless acceptance (G9.1 / G9.6 / G9.7)
        run: cargo test -p ice-box --lib 'g9_' -- --nocapture

      - name: Windows proxy-sys tests
        run: cargo test -p ice-proxy-sys

      - name: Build app bundle (tauri build, NSIS)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:win -- --config src-tauri/tauri.updater.conf.json
        working-directory: apps/desktop

      - name: Verify updater artifacts (Windows)
        run: |
          shopt -s nullglob
          exe=(target/release/bundle/nsis/*-setup.exe)
          if [[ "${#exe[@]}" -eq 0 ]]; then
            exe=(target/release/bundle/nsis/*.exe)
          fi
          sig=(target/release/bundle/nsis/*.exe.sig)
          test "${#exe[@]}" -ge 1
          test "${#sig[@]}" -ge 1
          test -s "${sig[0]}"
          echo "nsis installer: ${exe[0]}"
          echo "updater signature: ${sig[0]}"

      - name: Verify Windows NSIS payload (sing-box, libcronet, launcher)
        run: |
          shopt -s nullglob
          exe=(target/release/bundle/nsis/*-setup.exe)
          if [[ "${#exe[@]}" -eq 0 ]]; then
            exe=(target/release/bundle/nsis/*.exe)
          fi
          test "${#exe[@]}" -ge 1
          listing=""
          if command -v 7z >/dev/null; then
            listing=$(7z l "${exe[0]}")
          elif [[ -x "/c/Program Files/7-Zip/7z.exe" ]]; then
            listing=$("/c/Program Files/7-Zip/7z.exe" l "${exe[0]}")
          else
            echo "7z not found; falling back to target/release resources"
            test -f target/release/sing-box.exe
            test -f target/release/libcronet.dll
            test -f target/release/ice-tun-launcher.exe
            exit 0
          fi
          echo "$listing"
          for name in sing-box.exe libcronet.dll ice-tun-launcher.exe; do
            echo "$listing" | grep -Fq "$name" || {
              echo "missing $name in NSIS payload"
              exit 1
            }
          done

      - name: Upload NSIS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ice-box-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      # upload-artifact keeps bundle subdirs (macos/, dmg/). Flatten so
      # merge-updater-latest.sh and `gh release create release-assets/*` see files.
      - name: Flatten downloaded artifacts
        run: |
          find release-assets -mindepth 2 -type f -exec mv -t release-assets {} +
          find release-assets -mindepth 1 -type d -empty -delete
          ls -la release-assets

      - name: Prepare release notes
        id: notes
        run: |
          bash scripts/release-notes.sh "${{ github.ref_name }}" > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Synthesize updater latest.json
        run: |
          bash scripts/merge-updater-latest.sh \
            release-assets \
            "${{ github.ref_name }}" \
            RELEASE_NOTES.md \
            > release-assets/latest.json
          test -s release-assets/latest.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release-assets/* \
            NOTICE \
            LICENSE \
            "third_party/sing-box/LICENSE#sing-box-LICENSE" \
            --title "ice-box ${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md
