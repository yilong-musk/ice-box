name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ice-box-${{ runner.os }}
          cache-on-failure: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/website/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop

      - name: Install website deps
        run: npm ci
        working-directory: apps/website

      - name: Fetch sing-box binary
        run: ./scripts/fetch-singbox.sh mac-arm64

      - name: Fetch GeoIP rule-sets
        run: ./scripts/fetch-geoip.sh

      - name: Workspace gate (G9.10)
        run: bash scripts/gate.sh

      - name: Headless macOS acceptance (G9.1 / G9.6 / G9.7)
        run: cargo test -p ice-box --lib 'g9_' -- --nocapture

      - name: macOS proxy-sys tests
        run: cargo test -p ice-proxy-sys

      - name: Build app bundle (tauri build)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --config src-tauri/tauri.updater.conf.json
        working-directory: apps/desktop

      - name: Verify privileged helper embedded (T5)
        run: |
          APP=$(find target/release/bundle/macos -name '*.app' -maxdepth 1 | head -n 1)
          test -n "$APP"
          test -x "$APP/Contents/Resources/ice-helper"
          echo "helper embedded: $APP/Contents/Resources/ice-helper"

      - name: Verify app bundle code signature (R3)
        run: |
          APP=$(find target/release/bundle/macos -name '*.app' -maxdepth 1 | head -n 1)
          test -n "$APP"
          bash scripts/verify-macos-code-sign.sh "$APP"

      - name: Verify updater artifacts (macOS)
        run: |
          shopt -s nullglob
          tar=(target/release/bundle/macos/*.app.tar.gz)
          sig=(target/release/bundle/macos/*.app.tar.gz.sig)
          test "${#tar[@]}" -eq 1
          test "${#sig[@]}" -eq 1
          test -s "${sig[0]}"
          echo "updater archive: ${tar[0]}"
          echo "updater signature: ${sig[0]}"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ice-box-macos
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  build-windows:
    name: Build Windows (NSIS)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ice-box-${{ runner.os }}
          cache-on-failure: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/website/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop

      - name: Install website deps
        run: npm ci
        working-directory: apps/website

      - name: Fetch sing-box binary
        run: ./scripts/fetch-singbox.sh win

      - name: Fetch GeoIP rule-sets
        run: ./scripts/fetch-geoip.sh

      - name: Workspace gate (G9.10)
        run: bash scripts/gate.sh

      - name: Headless acceptance (G9.1 / G9.6 / G9.7)
        run: cargo test -p ice-box --lib 'g9_' -- --nocapture

      - name: Windows proxy-sys tests
        run: cargo test -p ice-proxy-sys

      - name: Build app bundle (tauri build, NSIS)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:win -- --config src-tauri/tauri.updater.conf.json
        working-directory: apps/desktop

      - name: Verify updater artifacts (Windows)
        run: |
          shopt -s nullglob
          exe=(target/release/bundle/nsis/*-setup.exe)
          if [[ "${#exe[@]}" -eq 0 ]]; then
            exe=(target/release/bundle/nsis/*.exe)
          fi
          sig=(target/release/bundle/nsis/*.exe.sig)
          test "${#exe[@]}" -ge 1
          test "${#sig[@]}" -ge 1
          test -s "${sig[0]}"
          echo "nsis installer: ${exe[0]}"
          echo "updater signature: ${sig[0]}"

      - name: Verify Windows NSIS payload (sing-box, libcronet, launcher)
        run: |
          shopt -s nullglob
          exe=(target/release/bundle/nsis/*-setup.exe)
          if [[ "${#exe[@]}" -eq 0 ]]; then
            exe=(target/release/bundle/nsis/*.exe)
          fi
          test "${#exe[@]}" -ge 1
          listing=""
          if command -v 7z >/dev/null; then
            listing=$(7z l "${exe[0]}")
          elif [[ -x "/c/Program Files/7-Zip/7z.exe" ]]; then
            listing=$("/c/Program Files/7-Zip/7z.exe" l "${exe[0]}")
          else
            echo "7z not found; falling back to target/release resources"
            test -f target/release/sing-box.exe
            test -f target/release/libcronet.dll
            test -f target/release/ice-tun-launcher.exe
            exit 0
          fi
          echo "$listing"
          for name in sing-box.exe libcronet.dll ice-tun-launcher.exe; do
            echo "$listing" | grep -Fq "$name" || {
              echo "missing $name in NSIS payload"
              exit 1
            }
          done

      - name: Upload NSIS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ice-box-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  build-android:
    name: Build Android (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          desktop_version="$(python3 -c 'import json; print(json.load(open("apps/desktop/src-tauri/tauri.conf.json"))["version"])')"
          mobile_version="$(python3 -c 'import json; print(json.load(open("apps/mobile/src-tauri/tauri.conf.json"))["version"])')"
          mobile_package="$(python3 -c 'import json; print(json.load(open("apps/mobile/package.json"))["version"])')"
          test "$tag" = "$cargo_version"
          test "$tag" = "$desktop_version"
          test "$tag" = "$mobile_version"
          test "$tag" = "$mobile_package"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ice-box-${{ runner.os }}-android-release
          cache-on-failure: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop

      # See ci.yml: do not install the removed `tools` package.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: bash scripts/ci-install-android-sdk.sh

      - name: Materialize release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "GitHub Actions secret $name is empty" >&2
              missing=1
            fi
          done
          test "$missing" -eq 0
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ice-box-release.jks"
          test -s "$RUNNER_TEMP/ice-box-release.jks"

      - name: Build signed release APK
        env:
          ICE_BOX_ANDROID_KEYSTORE: ${{ runner.temp }}/ice-box-release.jks
          ICE_BOX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ICE_BOX_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ICE_BOX_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/build-android-apk.sh release arm64

      - name: Name the release APK
        run: |
          ver="${GITHUB_REF_NAME#v}"
          src="$(find apps/mobile/src-tauri/gen/android/app/build/outputs/apk -type f -path '*/release/*.apk' | head -n 1)"
          test -n "$src"
          cp "$src" "ice-box_${ver}_android_arm64.apk"
          bash scripts/verify-android-apk.sh --release "ice-box_${ver}_android_arm64.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: ice-box-android
          path: ice-box_*_android_arm64.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      # upload-artifact keeps bundle subdirs (macos/, dmg/). Flatten so
      # merge-updater-latest.sh and `gh release create release-assets/*` see files.
      - name: Flatten downloaded artifacts
        run: |
          find release-assets -mindepth 2 -type f -exec mv -t release-assets {} +
          find release-assets -mindepth 1 -type d -empty -delete
          ls -la release-assets

      - name: Prepare release notes
        id: notes
        run: |
          bash scripts/release-notes.sh "${{ github.ref_name }}" > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Synthesize updater latest.json
        run: |
          bash scripts/merge-updater-latest.sh \
            release-assets \
            "${{ github.ref_name }}" \
            RELEASE_NOTES.md \
            > release-assets/latest.json
          test -s release-assets/latest.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `file#label` only sets the GitHub label; the asset name stays the
          # basename. Two LICENSE files would collide, so copy the bundled
          # sing-box text to a unique name first.
          cp third_party/sing-box/LICENSE sing-box-LICENSE
          gh release create "${{ github.ref_name }}" \
            release-assets/* \
            NOTICE \
            LICENSE \
            sing-box-LICENSE \
            --title "ice-box ${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md
