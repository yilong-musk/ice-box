name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI bundles are packaging smoke tests, not shipping binaries. The workspace
# release profile (thin LTO + codegen-units = 1 + strip) is most of `tauri
# build` here; release.yml has no override and still ships the real profile.
# Same env on test + build jobs so rust-cache's environment hash matches
# within an OS; they still use different shared-key suffixes so a parallel
# save cannot clobber the other job's target/.
env:
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_STRIP: "none"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  gate-linux:
    name: gate (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ice-box-${{ runner.os }}
          cache-on-failure: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/website/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop

      - name: Install website deps
        run: npm ci
        working-directory: apps/website

      - name: Workspace gate (G9.10)
        run: bash scripts/gate.sh

  macos-test:
    name: test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ice-box-${{ runner.os }}-test
          cache-on-failure: true

      # Rust half only: frontend/website checks are platform independent
      # and run in gate (linux).
      - name: Workspace gate (G9.10, rust)
        env:
          GATE_SCOPE: rust
        run: bash scripts/gate.sh

  macos-build:
    name: build (macOS dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ice-box-${{ runner.os }}-build
          cache-on-failure: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop

      - name: Fetch sing-box binary
        run: ./scripts/fetch-singbox.sh

      - name: Fetch GeoIP rule-sets
        run: ./scripts/fetch-geoip.sh

      - name: Build app bundle (tauri build)
        run: npm run tauri build
        working-directory: apps/desktop

      - name: Verify privileged helper embedded (T5)
        run: |
          APP=$(find target/release/bundle/macos -name '*.app' -maxdepth 1 | head -n 1)
          test -n "$APP"
          test -x "$APP/Contents/Resources/ice-helper"
          echo "helper embedded: $APP/Contents/Resources/ice-helper"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ice-box-macos
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app

  # Branch protection requires this check name. Keep it even though the work
  # now lives in macos-test / macos-build (run in parallel).
  gate-build-macos:
    name: gate + build (macOS dmg)
    needs: [macos-test, macos-build]
    if: "always() && !cancelled()"
    runs-on: ubuntu-latest
    steps:
      - name: Both macOS jobs passed
        run: |
          test "${{ needs.macos-test.result }}" = "success"
          test "${{ needs.macos-build.result }}" = "success"

  windows-test:
    name: test (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ice-box-${{ runner.os }}-test
          cache-on-failure: true

      - name: Workspace gate (G9.10, rust)
        env:
          GATE_SCOPE: rust
        run: bash scripts/gate.sh

  windows-build:
    name: build (Windows nsis)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ice-box-${{ runner.os }}-build
          cache-on-failure: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop

      - name: Fetch sing-box binary
        run: ./scripts/fetch-singbox.sh win

      - name: Fetch GeoIP rule-sets
        run: ./scripts/fetch-geoip.sh

      - name: Build app bundle (tauri build, NSIS)
        run: npm run build:win
        working-directory: apps/desktop

      - name: Verify Windows NSIS payload (sing-box, libcronet, launcher)
        run: |
          shopt -s nullglob
          exe=(target/release/bundle/nsis/*.exe)
          test "${#exe[@]}" -ge 1
          listing=""
          if command -v 7z >/dev/null; then
            listing=$(7z l "${exe[0]}")
          elif [[ -x "/c/Program Files/7-Zip/7z.exe" ]]; then
            listing=$("/c/Program Files/7-Zip/7z.exe" l "${exe[0]}")
          else
            echo "7z not found; falling back to target/release resources"
            test -f target/release/sing-box.exe
            test -f target/release/libcronet.dll
            test -f target/release/ice-tun-launcher.exe
            exit 0
          fi
          echo "$listing"
          for name in sing-box.exe libcronet.dll ice-tun-launcher.exe; do
            echo "$listing" | grep -Fq "$name" || {
              echo "missing $name in NSIS payload"
              exit 1
            }
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ice-box-windows
          path: |
            target/release/bundle/nsis/*.exe

  # Branch protection requires this check name. See gate-build-macos.
  gate-build-windows:
    name: gate + build (Windows nsis)
    needs: [windows-test, windows-build]
    if: "always() && !cancelled()"
    runs-on: ubuntu-latest
    steps:
      - name: Both Windows jobs passed
        run: |
          test "${{ needs.windows-test.result }}" = "success"
          test "${{ needs.windows-build.result }}" = "success"
