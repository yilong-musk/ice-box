name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI bundles are packaging smoke tests, not shipping binaries. The workspace
# release profile (thin LTO + codegen-units = 1 + strip) is most of `tauri
# build` here; release.yml has no override and still ships the real profile.
# Same env on test + build jobs so rust-cache's environment hash matches
# within an OS; they still use different shared-key suffixes so a parallel
# save cannot clobber the other job's target/.
env:
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_STRIP: "none"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  gate-linux:
    name: gate (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ice-box-${{ runner.os }}
          cache-on-failure: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/website/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop

      - name: Install website deps
        run: npm ci
        working-directory: apps/website

      - name: Workspace gate (G9.10)
        run: bash scripts/gate.sh

  macos-test:
    name: test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ice-box-${{ runner.os }}-test
          cache-on-failure: true

      # Rust half only: frontend/website checks are platform independent
      # and run in gate (linux).
      - name: Workspace gate (G9.10, rust)
        env:
          GATE_SCOPE: rust
        run: bash scripts/gate.sh

  macos-build:
    name: build (macOS dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ice-box-${{ runner.os }}-build
          cache-on-failure: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop

      - name: Fetch sing-box binary
        run: ./scripts/fetch-singbox.sh

      - name: Fetch GeoIP rule-sets
        run: ./scripts/fetch-geoip.sh

      - name: Build app bundle (tauri build)
        run: npm run tauri build
        working-directory: apps/desktop

      - name: Verify privileged helper embedded (T5)
        run: |
          APP=$(find target/release/bundle/macos -name '*.app' -maxdepth 1 | head -n 1)
          test -n "$APP"
          test -x "$APP/Contents/Resources/ice-helper"
          echo "helper embedded: $APP/Contents/Resources/ice-helper"

      - name: Verify app bundle code signature (R3)
        run: |
          APP=$(find target/release/bundle/macos -name '*.app' -maxdepth 1 | head -n 1)
          test -n "$APP"
          bash scripts/verify-macos-code-sign.sh "$APP"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ice-box-macos
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app

  # Branch protection requires this check name. Keep it even though the work
  # now lives in macos-test / macos-build (run in parallel).
  gate-build-macos:
    name: gate + build (macOS dmg)
    needs: [macos-test, macos-build]
    if: "always() && !cancelled()"
    runs-on: ubuntu-latest
    steps:
      - name: Both macOS jobs passed
        run: |
          test "${{ needs.macos-test.result }}" = "success"
          test "${{ needs.macos-build.result }}" = "success"

  windows-test:
    name: test (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ice-box-${{ runner.os }}-test
          cache-on-failure: true

      - name: Workspace gate (G9.10, rust)
        env:
          GATE_SCOPE: rust
        run: bash scripts/gate.sh

  windows-build:
    name: build (Windows nsis)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ice-box-${{ runner.os }}-build
          cache-on-failure: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop

      - name: Fetch sing-box binary
        run: ./scripts/fetch-singbox.sh win

      - name: Fetch GeoIP rule-sets
        run: ./scripts/fetch-geoip.sh

      - name: Build app bundle (tauri build, NSIS)
        run: npm run build:win
        working-directory: apps/desktop

      - name: Verify Windows NSIS payload (sing-box, libcronet, launcher)
        run: |
          shopt -s nullglob
          exe=(target/release/bundle/nsis/*.exe)
          test "${#exe[@]}" -ge 1
          listing=""
          if command -v 7z >/dev/null; then
            listing=$(7z l "${exe[0]}")
          elif [[ -x "/c/Program Files/7-Zip/7z.exe" ]]; then
            listing=$("/c/Program Files/7-Zip/7z.exe" l "${exe[0]}")
          else
            echo "7z not found; falling back to target/release resources"
            test -f target/release/sing-box.exe
            test -f target/release/libcronet.dll
            test -f target/release/ice-tun-launcher.exe
            exit 0
          fi
          echo "$listing"
          for name in sing-box.exe libcronet.dll ice-tun-launcher.exe; do
            echo "$listing" | grep -Fq "$name" || {
              echo "missing $name in NSIS payload"
              exit 1
            }
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ice-box-windows
          path: |
            target/release/bundle/nsis/*.exe

  # Branch protection requires this check name. See gate-build-macos.
  gate-build-windows:
    name: gate + build (Windows nsis)
    needs: [windows-test, windows-build]
    if: "always() && !cancelled()"
    runs-on: ubuntu-latest
    steps:
      - name: Both Windows jobs passed
        run: |
          test "${{ needs.windows-test.result }}" = "success"
          test "${{ needs.windows-build.result }}" = "success"

  # Debug APKs are signed with the Android debug key. The project release
  # keystore is used only by release.yml.
  android-debug:
    name: build (Android debug apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ice-box-${{ runner.os }}-android
          cache-on-failure: true

      # The action's default package list still installs `tools`, which the
      # current SDK repository no longer ships. cmdline-tools come with the
      # action; this job installs platforms, build-tools, and the NDK next.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: bash scripts/ci-install-android-sdk.sh

      - name: Configure Android Rust linkers
        run: |
          # shellcheck disable=SC1091
          source scripts/android-rust-linkers.sh
          {
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER"
            echo "CC_aarch64_linux_android=$CC_aarch64_linux_android"
            echo "CC_x86_64_linux_android=$CC_x86_64_linux_android"
            echo "CXX_aarch64_linux_android=$CXX_aarch64_linux_android"
            echo "CXX_x86_64_linux_android=$CXX_x86_64_linux_android"
            echo "AR_aarch64_linux_android=$AR_aarch64_linux_android"
            echo "AR_x86_64_linux_android=$AR_x86_64_linux_android"
          } >> "$GITHUB_ENV"

      - name: Check Android Rust targets
        run: |
          cargo check -p ice-box-mobile --target aarch64-linux-android
          cargo check -p ice-box-mobile --target x86_64-linux-android

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop

      - name: Restore libbox
        id: libbox
        uses: actions/cache@v4
        with:
          path: |
            apps/mobile/src-tauri/gen/android/app/libs/libbox.aar
            ~/.cache/ice-box
          key: libbox-android-arm64-${{ hashFiles('third_party/sing-box/VERSION', 'scripts/build-libbox.sh') }}

      - name: Build libbox (arm64)
        if: steps.libbox.outputs.cache-hit != 'true'
        run: bash scripts/build-libbox.sh android arm64

      - name: Build debug APK
        env:
          ICE_BOX_SKIP_LIBBOX: "1"
        run: bash scripts/build-android-apk.sh debug arm64

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ice-box-android-debug
          path: apps/mobile/src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
