name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gate-linux:
    name: gate (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ice-box-${{ runner.os }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop

      - name: Workspace gate (G9.10)
        run: bash scripts/gate.sh

  gate-build-macos:
    name: gate + build (macOS dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ice-box-${{ runner.os }}
          cache-on-failure: true

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop

      - name: Fetch sing-box binary
        run: ./scripts/fetch-singbox.sh

      - name: Workspace gate (G9.10)
        run: bash scripts/gate.sh

      - name: Headless macOS acceptance (G9.1 / G9.6 / G9.7)
        run: cargo test -p ice-box --lib 'g9_' -- --nocapture

      - name: macOS proxy-sys unit tests
        run: cargo test -p ice-proxy-sys --lib

      - name: Build app bundle (tauri build)
        run: npm run tauri build
        working-directory: apps/desktop

      - name: Verify privileged helper embedded (T5)
        run: |
          APP=$(find target/release/bundle/macos -name '*.app' -maxdepth 1 | head -n 1)
          test -n "$APP"
          test -x "$APP/Contents/Resources/ice-helper"
          echo "helper embedded: $APP/Contents/Resources/ice-helper"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ice-box-macos
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app

  gate-build-windows:
    name: gate + build (Windows nsis)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ice-box-${{ runner.os }}
          cache-on-failure: true

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop

      - name: Fetch sing-box binary
        run: ./scripts/fetch-singbox.sh win

      - name: Workspace gate (G9.10)
        run: bash scripts/gate.sh

      - name: Headless acceptance (G9.1 / G9.6 / G9.7)
        run: cargo test -p ice-box --lib 'g9_' -- --nocapture

      - name: Build app bundle (tauri build, NSIS)
        run: npm run build:win
        working-directory: apps/desktop

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ice-box-windows
          path: |
            target/release/bundle/nsis/*.exe
