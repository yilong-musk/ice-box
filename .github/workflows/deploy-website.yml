name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - "apps/desktop/src/**"
      - "apps/desktop/package.json"
      - "apps/desktop/package-lock.json"
      - ".github/workflows/deploy-website.yml"
  # A release publishes the installers the site links to. Deploy after it
  # finishes so direct download buttons never point at a missing tag.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_OPTIONS: --no-deprecation

concurrency:
  group: pages
  # Never cancel an in-flight deployment: a main push can arrive while the
  # post-release deploy is running, and that run may then skip because the next
  # version is not published yet. Queue instead; the later run rebuilds main.
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.release.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run checks out the default branch; pin it explicitly so
          # push, release-completion, and manual runs all build main's site.
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Require the app version's release to be published
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "manual dispatch: skipping the release check"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="$(python3 -c 'import json; print(json.load(open("apps/desktop/package.json"))["version"])')"
          state="$(bash scripts/gh-release-state.sh --kind "v$version")"
          case "$state" in
          missing)
            echo "::notice::release v$version does not exist yet; skipping deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
            ;;
          draft | prerelease)
            echo "::notice::release v$version is not a published final release ($state); skipping deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
            ;;
          final) ;;
          *)
            echo "unexpected release state: $state" >&2
            exit 1
            ;;
          esac
          assets="$(gh release view "v$version" --json assets --jq '.assets[].name')"
          missing=0
          for name in "ice-box_${version}_aarch64.dmg" \
            "ice-box_${version}_x64-setup.exe" \
            "ice-box_${version}_android_arm64.apk"; do
            if ! grep -qxF "$name" <<< "$assets"; then
              echo "release v$version is missing $name" >&2
              missing=1
            fi
          done
          test "$missing" -eq 0
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Install website dependencies
        if: steps.release.outputs.skip != 'true'
        run: npm ci
        working-directory: apps/website

      - name: Make shared dependencies visible to desktop sources
        if: steps.release.outputs.skip != 'true'
        run: ln -s "$GITHUB_WORKSPACE/apps/website/node_modules" "$GITHUB_WORKSPACE/apps/desktop/node_modules"

      - name: Build website
        if: steps.release.outputs.skip != 'true'
        run: npm run build
        working-directory: apps/website

      - uses: actions/upload-pages-artifact@v5
        if: steps.release.outputs.skip != 'true'
        with:
          path: apps/website/dist

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.skip != 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
