name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - "apps/desktop/src/**"
      - "apps/desktop/package.json"
      - "apps/desktop/package-lock.json"
      - ".github/workflows/deploy-website.yml"
  # A release publishes the installers the site links to. Deploy after it
  # finishes so direct download buttons never point at a missing tag.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_OPTIONS: --no-deprecation

concurrency:
  group: pages
  # Never cancel an in-flight deployment: a main push can arrive while the
  # post-release deploy is running, and that run may then skip because the next
  # version is not published yet. Queue instead; the later run rebuilds main.
  cancel-in-progress: false

jobs:
  build:
    # Skip Release preflight and rehearsal runs: they never publish a release,
    # and once the current version is already published they would otherwise
    # trigger redundant website rebuilds.
    if: >-
      ${{
        github.event_name != 'workflow_run' || (
          github.event.workflow_run.conclusion == 'success' &&
          !startsWith(github.event.workflow_run.display_title, 'Release (preflight)') &&
          !startsWith(github.event.workflow_run.display_title, 'Release (rehearse)')
        )
      }}
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.release.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run checks out the default branch; pin it explicitly so
          # push, release-completion, and manual runs all build main's site.
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Require the app version's release to be published
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "manual dispatch: skipping the release check"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="$(python3 -c 'import json; print(json.load(open("apps/desktop/package.json"))["version"])')"
          state="$(bash scripts/gh-release-state.sh --kind "v$version")"
          case "$state" in
          missing)
            echo "::notice::release v$version does not exist yet; skipping deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
            ;;
          draft | prerelease)
            echo "::notice::release v$version is not a published final release ($state); skipping deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
            ;;
          final) ;;
          *)
            echo "unexpected release state: $state" >&2
            exit 1
            ;;
          esac
          assets="$(gh release view "v$version" --json assets --jq '.assets[].name')"
          status=0
          python3 - "$version" "$assets" <<'PY' || status=$?
          import sys

          version = sys.argv[1]
          present = {line.strip() for line in sys.argv[2].splitlines() if line.strip()}
          core = tuple(int(part) for part in version.split("-", 1)[0].split("."))

          # (notice when the whole set is absent, asset names, version through
          # which a completely missing set skips deploy). None means the set is
          # required for every release. A partial set fails at every version.
          # Linux desktop builds arrived after 0.4.0; CLI archives after 0.4.1.
          groups = [
              (
                  None,
                  [
                      f"ice-box_{version}_aarch64.dmg",
                      f"ice-box_{version}_x64-setup.exe",
                      f"ice-box_{version}_android_arm64.apk",
                  ],
                  None,
              ),
              (
                  "Linux desktop builds (no Linux assets)",
                  [
                      f"ice-box_{version}_amd64.deb",
                      f"ice-box_{version}_amd64.AppImage",
                      f"ice-box_{version}_arm64.deb",
                      f"ice-box_{version}_aarch64.AppImage",
                  ],
                  (0, 4, 0),
              ),
              (
                  "CLI archives (no CLI assets)",
                  [
                      f"ice-box-cli_{version}_darwin_aarch64.tar.gz",
                      f"ice-box-cli_{version}_windows_x86_64.zip",
                      f"ice-box-cli_{version}_linux_x86_64.tar.gz",
                      f"ice-box-cli_{version}_linux_aarch64.tar.gz",
                  ],
                  (0, 4, 1),
              ),
          ]

          for notice, names, predates in groups:
              missing = [name for name in names if name not in present]
              if not missing:
                  continue
              if (
                  notice is not None
                  and predates is not None
                  and len(missing) == len(names)
                  and core <= predates
              ):
                  print(
                      f"::notice::release v{version} predates {notice}; skipping deploy"
                  )
                  sys.exit(10)
              for name in missing:
                  print(f"release v{version} is missing {name}", file=sys.stderr)
              sys.exit(1)
          PY
          if [[ "$status" -eq 10 ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$status" -eq 0
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Install website dependencies
        if: steps.release.outputs.skip != 'true'
        run: npm ci
        working-directory: apps/website

      - name: Make shared dependencies visible to desktop sources
        if: steps.release.outputs.skip != 'true'
        run: ln -s "$GITHUB_WORKSPACE/apps/website/node_modules" "$GITHUB_WORKSPACE/apps/desktop/node_modules"

      - name: Build website
        if: steps.release.outputs.skip != 'true'
        run: npm run build
        working-directory: apps/website

      - uses: actions/upload-pages-artifact@v5
        if: steps.release.outputs.skip != 'true'
        with:
          path: apps/website/dist

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.skip != 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
