name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - "apps/desktop/src/**"
      - "apps/desktop/package.json"
      - "apps/desktop/package-lock.json"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_OPTIONS: --no-deprecation

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install website dependencies
        run: npm ci
        working-directory: apps/website
      - name: Make shared dependencies visible to desktop sources
        run: ln -s "$GITHUB_WORKSPACE/apps/website/node_modules" "$GITHUB_WORKSPACE/apps/desktop/node_modules"
      - name: Build website
        run: npm run build
        working-directory: apps/website
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/website/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
