name: Android release APK

# Build the release APK the way release.yml does, so the release-only
# settings (size-optimized fat-LTO Rust library from BuildTask.kt, packaging
# and locale filters, verify-android-apk.sh --release) are exercised before a
# tag. It is signed with a throwaway key: the project keystore stays in
# release.yml.
#
# This is slow (shipping profile, fat LTO) and not a required check, so pull
# requests run it only when they touch the release packaging. Whether the app
# still compiles for Android is already covered on every PR by
# `build (Android debug apk)` in ci.yml. Every push to main runs it without a
# path filter, so any change reaching main is release-built before a tag.
on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - .github/workflows/android-release.yml
      - apps/mobile/src-tauri/Cargo.toml
      - apps/mobile/src-tauri/tauri.conf.json
      - apps/mobile/src-tauri/gen/android/**
      - apps/mobile/plugins/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - third_party/sing-box/VERSION
      - scripts/android-rust-linkers.sh
      - scripts/build-android-apk.sh
      - scripts/build-libbox.sh
      - scripts/ci-install-android-sdk.sh
      - scripts/verify-android-apk.sh
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-release:
    name: build (Android release apk)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # See android-debug in ci.yml: libbox is built from a checkout without
      # go.mod.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ice-box-${{ runner.os }}-android-release-ci
          cache-on-failure: true

      # See android-debug in ci.yml: do not install the removed `tools`
      # package.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: bash scripts/ci-install-android-sdk.sh

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop

      - name: Restore libbox
        id: libbox
        uses: actions/cache@v6
        with:
          path: |
            apps/mobile/src-tauri/gen/android/app/libs/libbox.aar
            ~/.cache/ice-box
          key: libbox-android-arm64-${{ hashFiles('third_party/sing-box/VERSION', 'scripts/build-libbox.sh') }}

      - name: Build libbox (arm64)
        if: steps.libbox.outputs.cache-hit != 'true'
        run: bash scripts/build-libbox.sh android arm64

      - name: Create throwaway signing key
        run: |
          pass="$(openssl rand -hex 16)"
          echo "::add-mask::$pass"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/ci-release.jks" -storetype PKCS12 \
            -storepass "$pass" -keypass "$pass" -alias ci \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=ice-box CI, O=ice-box"
          {
            echo "ICE_BOX_ANDROID_KEYSTORE=$RUNNER_TEMP/ci-release.jks"
            echo "ICE_BOX_ANDROID_KEYSTORE_PASSWORD=$pass"
            echo "ICE_BOX_ANDROID_KEY_ALIAS=ci"
            echo "ICE_BOX_ANDROID_KEY_PASSWORD=$pass"
          } >> "$GITHUB_ENV"

      # No CARGO_PROFILE_RELEASE_* overrides here (unlike ci.yml), so the
      # build uses the shipping profile.
      - name: Build release APK
        env:
          ICE_BOX_SKIP_LIBBOX: "1"
        run: bash scripts/build-android-apk.sh release arm64

      - name: Report APK size
        run: |
          apk="$(find apps/mobile/src-tauri/gen/android/app/build/outputs/apk -type f -path '*/release/*.apk' | head -n 1)"
          ls -l "$apk"
          unzip -v "$apk" | grep -E 'lib/|resources.arsc'
